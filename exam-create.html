<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>একাডেমিক কেয়ার — পরীক্ষা তৈরি</title><style>body{font-family:system-ui;background:#f1f5f9;color:#102a43;padding:16px}.wrap{max-width:900px;margin:auto}.card{background:white;padding:18px;border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:10px 0}input,select{width:100%;box-sizing:border-box;padding:10px;margin-top:5px}button{padding:10px 14px;margin:5px;background:#1769aa;color:white;border:0;border-radius:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>নতুন পরীক্ষা তৈরি</h1><p>জব কেয়ারের অনুরূপ। প্রশ্ন নির্বাচনের জন্য শ্রেণি, বিষয়, অধ্যায় ও সেট—চারটিই বাধ্যতামূলক।</p><label>পরীক্ষার নাম<input id="examName"></label><div class="grid"><label>সময় (মিনিট)<input id="duration" type="number" value="30"></label><label>প্রতি প্রশ্নের নম্বর<input id="marks" type="number" value="1"></label><label>নেগেটিভ মার্ক<input id="negative" type="number" value="0"></label><label>পাস নম্বর<input id="pass" type="number" value="0"></label></div></section><section class="card"><h2>প্রশ্ন নির্বাচন</h2><div class="grid"><label>১. শ্রেণি *<select id="class"><option>শ্রেণি নির্বাচন করুন</option></select></label><label>২. বিষয় *<select id="subject" disabled><option>আগে শ্রেণি নির্বাচন করুন</option></select></label><label>৩. অধ্যায় *<select id="chapter" disabled><option>আগে বিষয় নির্বাচন করুন</option></select></label><label>৪. সেট *<select id="set" disabled><option>আগে অধ্যায় নির্বাচন করুন</option></select></label></div><button id="show">প্রশ্ন দেখুন</button><div id="questions"></div><button id="all">সব নির্বাচন</button><button id="clear">সব বাতিল</button></section><section class="card"><button id="create">পরীক্ষা তৈরি করুন</button><p id="message">অ্যাডমিন যাচাই ও প্রশ্ন ব্যাংক সংযোগের কাজ বাকি।</p></section></main></body></html>
