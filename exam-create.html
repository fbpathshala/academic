<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>একাডেমিক কেয়ার — পরীক্ষা তৈরি</title></head><body><h1>নতুন পরীক্ষা তৈরি</h1><p>প্রশ্ন নির্বাচনের জন্য শ্রেণি, বিষয়, অধ্যায় ও সেট—চারটিই বাধ্যতামূলক।</p><p>পূর্ণ ইন্টারফেস প্রস্তুত করা হচ্ছে।</p></body></html>
