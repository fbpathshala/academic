<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>একাডেমিক কেয়ার | পরীক্ষা তৈরি</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#102a43;padding:14px}.wrap{max-width:950px;margin:auto}.card{background:#fff;padding:18px;border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:10px 0}input,select{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #c7d4e2;border-radius:7px}button{padding:10px 14px;margin:5px;background:#1769aa;color:#fff;border:0;border-radius:8px;cursor:pointer}.q{display:flex;gap:10px;padding:10px;border-bottom:1px solid #ddd}.q input{width:auto}.muted{color:#486581}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head>
<body><main class="wrap">
<section id="login" class="card"><h1>অ্যাডমিন প্রবেশ</h1><form id="loginForm"><label>ইমেইল<input id="email" type="email" required></label><label>পাসওয়ার্ড<input id="password" type="password" required></label><button>প্রবেশ করুন</button></form><p id="authMsg"></p></section>
<div id="app" hidden><section class="card"><h1>নতুন পরীক্ষা তৈরি</h1><p>জব কেয়ারের অনুরূপ। শ্রেণি, বিষয়, অধ্যায় ও সেট—চারটিই বাধ্যতামূলক।</p>
<label>পরীক্ষার নাম<input id="examName" maxlength="200" required></label><div class="grid">
<label>সময় (মিনিট)<input id="duration" type="number" min="1" max="600" value="30"></label>
<label>প্রতি প্রশ্নের নম্বর<input id="marks" type="number" min="0" step="0.01" value="1"></label>
<label>নেগেটিভ মার্ক<input id="negative" type="number" min="0" step="0.01" value="0"></label>
<label>পাস নম্বর<input id="pass" type="number" min="0" step="0.01" value="0"></label></div></section>
<section class="card"><h2>প্রশ্ন নির্বাচন</h2><div class="grid">
<label>১. শ্রেণি *<select id="class"><option value="">শ্রেণি নির্বাচন করুন</option></select></label>
<label>২. বিষয় *<select id="subject" disabled><option value="">আগে শ্রেণি নির্বাচন করুন</option></select></label>
<label>৩. অধ্যায় *<select id="chapter" disabled><option value="">আগে বিষয় নির্বাচন করুন</option></select></label>
<label>৪. সেট *<select id="set" disabled><option value="">আগে অধ্যায় নির্বাচন করুন</option></select></label></div>
<button id="show" type="button">প্রশ্ন দেখুন</button><p id="count" class="muted">চারটি ফিল্টার নির্বাচন করুন।</p><div id="questions"></div><button id="all" type="button">সব নির্বাচন</button><button id="clear" type="button">সব বাতিল</button><p id="qmsg"></p></section>
<section class="card"><button id="create" type="button">পরীক্ষা তৈরি করুন</button><button id="logout" type="button">লগআউট</button><p id="msg"></p></section></div></main>
<script>
(async function(){
const db=supabase.createClient("https://ydvbnalhcnfqpxkkmywr.supabase.co","sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a");
const el=id=>document.getElementById(id), digit=n=>String(n).replace(/\d/g,x=>"০১২৩৪৫৬৭৮৯"[+x]);
let admin=null,bank=[],chosen=new Set(),subjectRows=[];
const safe=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fill(id,rows,label,placeholder){el(id).innerHTML='<option value="">'+placeholder+'</option>'+rows.map(x=>'<option value="'+x.id+'">'+safe(x[label])+'</option>').join("");el(id).disabled=false}
function reset(from){const ids=from==="subject"?["subject","chapter","set"]:from==="chapter"?["chapter","set"]:["set"];ids.forEach(id=>{el(id).innerHTML='<option value="">নির্বাচন করুন</option>';el(id).disabled=true});bank=[];chosen.clear();el("questions").innerHTML="";el("count").textContent="চারটি ফিল্টার নির্বাচন করে প্রশ্ন দেখুন।"}
function validFilters(){return el("class").value&&el("subject").value&&el("chapter").value&&el("set").value}
async function start(session){if(!session){el("login").hidden=false;el("app").hidden=true;return}const check=await db.rpc("academic_care_is_admin");if(check.error||check.data!==true){await db.auth.signOut();el("authMsg").textContent=check.error?.message||"এই অ্যাকাউন্টে অ্যাডমিন অনুমতি নেই।";return}admin=session.user;el("login").hidden=true;el("app").hidden=false;const r=await db.from("academic_care_categories").select("id,name").order("name");if(r.error){el("qmsg").textContent=r.error.message;return}fill("class",r.data||[],"name","শ্রেণি নির্বাচন করুন")}
async function subjects(){reset("subject");if(!el("class").value)return;const r=await db.from("academic_care_folders").select("id,folder_name").eq("category_id",el("class").value).order("folder_name");if(r.error)return el("qmsg").textContent=r.error.message;subjectRows=r.data||[];fill("subject",subjectRows,"folder_name","বিষয় নির্বাচন করুন")}
async function chapters(){reset("chapter");if(!el("subject").value)return;const r=await db.from("academic_care_chapters").select("id,chapter_name").eq("folder_id",el("subject").value).order("chapter_name");if(r.error)return el("qmsg").textContent=r.error.message;fill("chapter",r.data||[],"chapter_name","অধ্যায় নির্বাচন করুন")}
async function sets(){reset("set");if(!el("chapter").value)return;const r=await db.from("academic_care_sets").select("id,set_name").eq("folder_id",el("subject").value).eq("chapter_id",el("chapter").value).order("set_name");if(r.error)return el("qmsg").textContent=r.error.message;fill("set",r.data||[],"set_name","সেট নির্বাচন করুন")}
function render(){el("questions").innerHTML=bank.map((q,i)=>'<label class="q"><input type="checkbox" data-id="'+q.id+'" '+(chosen.has(q.id)?"checked":"")+'><span>'+digit(i+1)+". "+safe(q.question_text)+(Array.isArray(q.options)?q.options.map(o=>"<br>"+safe(o.value||"")+". "+safe(o.text||"")).join(""):"")+'</span></label>').join("");el("questions").querySelectorAll("[data-id]").forEach(x=>x.onchange=()=>{x.checked?chosen.add(x.dataset.id):chosen.delete(x.dataset.id);updateCount()});updateCount()}
function updateCount(){el("count").textContent="মোট "+digit(bank.length)+"টি · নির্বাচিত "+digit(chosen.size)+"টি"}
async function loadQuestions(){if(!validFilters())return el("qmsg").textContent="শ্রেণি, বিষয়, অধ্যায় ও সেট—সব নির্বাচন করুন।";const r=await db.from("academic_care_question_bank_items").select("id,question_text,question_type,options,marks,sort_order,subject,category_id,folder_id,chapter_id,set_id").eq("category_id",el("class").value).eq("folder_id",el("subject").value).eq("chapter_id",el("chapter").value).eq("set_id",el("set").value).order("sort_order");if(r.error)return el("qmsg").textContent=r.error.message;bank=r.data||[];chosen.clear();render();el("qmsg").textContent=bank.length?"প্রশ্ন নির্বাচন করুন।":"এই সেটে কোনো প্রশ্ন পাওয়া যায়নি।"}
el("class").onchange=subjects;el("subject").onchange=chapters;el("chapter").onchange=sets;el("set").onchange=()=>{bank=[];chosen.clear();el("questions").innerHTML="";el("qmsg").textContent="প্রশ্ন দেখুন চাপুন।";updateCount()};el("show").onclick=loadQuestions;el("all").onclick=()=>{bank.forEach(q=>chosen.add(q.id));render()};el("clear").onclick=()=>{chosen.clear();render()};
el("loginForm").onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});if(r.error)return el("authMsg").textContent="প্রবেশ করা যায়নি; ইমেইল/পাসওয়ার্ড যাচাই করুন।";await start(r.data.session)};
el("logout").onclick=()=>db.auth.signOut();db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT")start(null)});
el("create").onclick=async()=>{const name=el("examName").value.trim(),duration=Number(el("duration").value),marks=Number(el("marks").value),negative=Number(el("negative").value),pass=Number(el("pass").value),list=bank.filter(q=>chosen.has(q.id));if(!name||!validFilters()||!list.length)return el("msg").textContent="পরীক্ষার নাম, চারটি ফিল্টার ও অন্তত একটি প্রশ্ন নির্বাচন করুন।";if(!Number.isInteger(duration)||duration<1||duration>600||[marks,negative,pass].some(n=>!Number.isFinite(n)||n<0))return el("msg").textContent="সময় ও নম্বর সঠিকভাবে দিন।";el("create").disabled=true;el("msg").textContent="পরীক্ষা তৈরি হচ্ছে…";let examId=null;try{const payload={title:name,exam_type:list.some(q=>q.question_type==="cq")?(list.some(q=>q.question_type==="mcq")?"MCQ_CQ":"CQ"):"MCQ",duration_minutes:duration,status:"draft",created_by:admin.id,settings:{total_questions:list.length,total_marks:list.length*marks,marks_per_question:marks,negative_mark:negative,pass_mark:pass,category_id:Number(el("class").value),folder_id:Number(el("subject").value),chapter_id:Number(el("chapter").value),set_id:Number(el("set").value)}};const e=await db.from("academic_care_exams").insert(payload).select("id").single();if(e.error)throw e.error;examId=e.data.id;const rows=list.map((q,i)=>({exam_id:examId,question_text:q.question_text,question_type:q.question_type,options:q.options||[],marks,sort_order:i+1,category_id:q.category_id,folder_id:q.folder_id,chapter_id:q.chapter_id,set_id:q.set_id,subject:q.subject||subjectRows.find(s=>String(s.id)===String(q.folder_id))?.folder_name||null}));const added=await db.from("academic_care_questions").insert(rows).select("id");if(added.error)throw added.error;const mcq=list.filter(q=>q.question_type==="mcq");if(mcq.length){const answers=await db.from("academic_care_question_bank_answer_keys").select("question_id,correct_option").in("question_id",mcq.map(q=>q.id));if(answers.error)throw answers.error;const map=new Map((answers.data||[]).map(a=>[a.question_id,a.correct_option]));const keys=added.data.map((q,i)=>({q,i})).filter(x=>list[x.i].question_type==="mcq"&&map.has(list[x.i].id)).map(x=>({question_id:x.q.id,correct_option:map.get(list[x.i].id)}));if(keys.length){const saved=await db.from("academic_care_answer_keys").insert(keys);if(saved.error)throw saved.error}}el("msg").textContent="পরীক্ষার খসড়া তৈরি হয়েছে। পরীক্ষা পরিচালনায় যাচ্ছেন…";setTimeout(()=>location.href="https://fbpathshala.github.io/academic/admin.html?central=1&view=exams",800)}catch(err){el("msg").textContent="ত্রুটি: "+(err.message||"পরীক্ষা তৈরি হয়নি")+(examId?"। খসড়া পরীক্ষা তৈরি হয়েছে; পরীক্ষা পরিচালনায় যাচাই করুন।":"")}finally{el("create").disabled=false}};
const session=await db.auth.getSession();await start(session.data.session);
})();
</script></body></html>
